[package]
name = "awna-keystore"
version = "0.1.0"
description = "A credential store: secrets that never print, with a system keychain backend and an in-memory store."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
keyring-core = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
